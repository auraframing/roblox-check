<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Checker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    background: #0d0715;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #d98cff;
    margin-bottom: 18px;
}

.add-box {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #4c2860;
    outline: none;
    background: #160d20;
    color: white;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    background: #a941e8;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.info {
    text-align: center;
    color: #9e8ca9;
    font-size: 13px;
    margin-bottom: 12px;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.account {
    display: grid;
    grid-template-columns:
        minmax(120px, 1fr)
        120px
        minmax(120px, 1.6fr)
        35px;

    align-items: center;
    gap: 8px;

    padding: 11px 12px;

    background: #160d20;
    border: 1px solid #30203b;
    border-radius: 10px;
}

.name {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status {
    font-weight: bold;
}

.online {
    color: #5cff9b;
}

.offline {
    color: #aaa0ad;
}

.ingame {
    color: #c878ff;
}

.banned {
    color: #ff6680;
}

.error {
    color: #ff6680;
}

.game {
    color: #c8b7d0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.remove {
    padding: 6px;
    background: #301522;
    color: #ff86a5;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #7f7089;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .account {
        grid-template-columns:
            minmax(90px, 1fr)
            90px
            minmax(90px, 1.4fr)
            30px;

        font-size: 13px;
    }

    .add-box button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>ROBLOX CHECKER</h1>

    <div class="add-box">

        <input
            id="input"
            type="text"
            placeholder="Username hoặc UserID"
            autocomplete="off"
        >

        <button onclick="addAccount()">
            THÊM
        </button>

    </div>

    <div class="info">
        AUTO CHECK: 5s
    </div>

    <div id="list" class="list"></div>

</div>

<script>

/*
====================================================
CẤU HÌNH
====================================================
*/

const CHECK_INTERVAL = 5000;


/*
====================================================
DANH SÁCH ACCOUNT
====================================================
*/

const accounts =
    JSON.parse(
        localStorage.getItem("robloxAccounts") || "[]"
    );

let checking = false;


/*
====================================================
LƯU
====================================================
*/

function save() {

    localStorage.setItem(
        "robloxAccounts",
        JSON.stringify(accounts)
    );

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function esc(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/*
====================================================
TÌM ACCOUNT
====================================================
*/

async function resolveUser(value) {

    value = value.trim();


    /*
    USER ID
    */

    if (/^\d+$/.test(value)) {

        const res = await fetch(
            "https://users.roblox.com/v1/users/" +
            encodeURIComponent(value)
        );

        if (!res.ok) {

            throw new Error(
                "Không tìm thấy tài khoản."
            );

        }

        const user =
            await res.json();

        return {

            id: user.id,

            name: user.name

        };

    }


    /*
    USERNAME
    */

    const res = await fetch(
        "https://users.roblox.com/v1/usernames/users",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                usernames: [value],

                excludeBannedUsers: false

            })

        }
    );


    if (!res.ok) {

        throw new Error(
            "Không thể tìm Username."
        );

    }


    const data =
        await res.json();


    if (
        !data.data ||
        data.data.length === 0
    ) {

        throw new Error(
            "Username không tồn tại."
        );

    }


    return {

        id: data.data[0].id,

        name: data.data[0].name

    };

}


/*
====================================================
THÊM ACCOUNT
====================================================
*/

async function addAccount() {

    const input =
        document.getElementById("input");

    const value =
        input.value.trim();


    if (!value) {

        return;

    }


    try {

        const user =
            await resolveUser(value);


        /*
        Không thêm trùng
        */

        if (
            accounts.some(
                account =>
                    account.id === user.id
            )
        ) {

            input.value = "";

            return;

        }


        accounts.push({

            id: user.id,

            name: user.name,

            status: "CHECKING...",

            statusClass: "",

            game: "—"

        });


        save();

        input.value = "";

        render();


        /*
        Check ngay account vừa thêm
        */

        await checkAllAccounts();


    } catch (error) {

        alert(
            error.message ||
            "Không thể thêm account."
        );

    }

}


/*
====================================================
XÓA ACCOUNT
====================================================
*/

function removeAccount(id) {

    const index =
        accounts.findIndex(
            account =>
                account.id === id
        );


    if (index !== -1) {

        accounts.splice(index, 1);

    }


    save();

    render();

}


/*
====================================================
ROBLOX PRESENCE API
====================================================
*/

async function getPresence(id) {

    const res =
        await fetch(
            "https://presence.roblox.com/v1/presence/users",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    userIds: [id]

                })

            }
        );


    if (!res.ok) {

        throw new Error(
            "Presence API lỗi"
        );

    }


    const data =
        await res.json();


    return (
        data.userPresences?.[0] ||
        null
    );

}


/*
====================================================
ROBLOX USER API
====================================================
*/

async function getUser(id) {

    const res =
        await fetch(
            "https://users.roblox.com/v1/users/" +
            encodeURIComponent(id)
        );


    if (!res.ok) {

        throw new Error(
            "User API lỗi"
        );

    }


    return await res.json();

}


/*
====================================================
GAME API

CHỈ TRẢ VỀ TÊN GAME ROBLOX THẬT
KHÔNG TỰ TẠO / KHÔNG ĐOÁN
====================================================
*/

async function getGameName(universeId) {

    /*
    Không có Universe ID
    */

    if (!universeId) {

        return "—";

    }


    try {

        const res =
            await fetch(
                "https://games.roblox.com/v1/games?universeIds=" +
                encodeURIComponent(universeId)
            );


        /*
        API lỗi
        */

        if (!res.ok) {

            return "—";

        }


        const data =
            await res.json();


        const game =
            data.data?.[0];


        /*
        Không có dữ liệu game thật
        */

        if (
            !game ||
            typeof game.name !== "string" ||
            game.name.trim() === ""
        ) {

            return "—";

        }


        /*
        Chỉ lấy tên Roblox trả về
        */

        return game.name;

    } catch {

        return "—";

    }

}


/*
====================================================
CHECK 1 ACCOUNT
====================================================
*/

async function checkAccount(account) {

    try {

        /*
        Lấy Presence + User cùng lúc
        */

        const [
            presence,
            user
        ] = await Promise.all([

            getPresence(account.id),

            getUser(account.id)

        ]);


        /*
        Roblox Account Banned
        */

        if (user.isBanned === true) {

            account.status =
                "BANNED";

            account.statusClass =
                "banned";

            account.game =
                "—";

            return;

        }


        /*
        Không có Presence
        */

        if (!presence) {

            account.status =
                "OFFLINE";

            account.statusClass =
                "offline";

            account.game =
                "—";

            return;

        }


        /*
        Presence Type
        */

        switch (
            presence.userPresenceType
        ) {


            /*
            OFFLINE
            */

            case 0:

                account.status =
                    "OFFLINE";

                account.statusClass =
                    "offline";

                account.game =
                    "—";

                break;


            /*
            ONLINE
            */

            case 1:

                account.status =
                    "ONLINE";

                account.statusClass =
                    "online";

                account.game =
                    "—";

                break;


            /*
            IN GAME
            */

            case 2:

                account.status =
                    "IN GAME";

                account.statusClass =
                    "ingame";


                /*
                Chỉ lấy game thật
                */

                account.game =
                    await getGameName(
                        presence.universeId
                    );

                break;


            /*
            ROBLOX STUDIO
            */

            case 3:

                account.status =
                    "IN STUDIO";

                account.statusClass =
                    "ingame";

                account.game =
                    "Roblox Studio";

                break;


            /*
            Không xác định
            */

            default:

                account.status =
                    "UNKNOWN";

                account.statusClass =
                    "error";

                account.game =
                    "—";

                break;

        }

    } catch {

        /*
        Không tự đoán dữ liệu
        */

        account.status =
            "ERROR";

        account.statusClass =
            "error";

        account.game =
            "—";

    }

}


/*
====================================================
CHECK TẤT CẢ

TẤT CẢ ACCOUNT ĐƯỢC BẮT ĐẦU
TRONG CÙNG MỘT ĐỢT
====================================================
*/

async function checkAllAccounts() {

    /*
    Không chạy chồng 2 đợt
    */

    if (checking) {

        return;

    }


    if (accounts.length === 0) {

        render();

        return;

    }


    checking = true;


    render();


    try {

        /*
        Promise.all:
        toàn bộ account chạy cùng batch
        */

        await Promise.all(

            accounts.map(
                account =>
                    checkAccount(account)
            )

        );


        save();

        render();

    } finally {

        checking = false;

    }

}


/*
====================================================
HIỂN THỊ
====================================================
*/

function render() {

    const list =
        document.getElementById("list");


    if (accounts.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Chưa có tài khoản
            </div>
        `;

        return;

    }


    list.innerHTML =
        accounts.map(
            account => `

                <div class="account">

                    <div class="name">
                        ${esc(account.name)}
                    </div>

                    <div
                        class="status ${account.statusClass}"
                    >
                        ${esc(account.status)}
                    </div>

                    <div class="game">
                        ${esc(account.game)}
                    </div>

                    <button
                        class="remove"
                        onclick="removeAccount(${account.id})"
                    >
                        ×
                    </button>

                </div>

            `
        ).join("");

}


/*
====================================================
ENTER ĐỂ THÊM
====================================================
*/

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addAccount();

            }

        }
    );


/*
====================================================
KHỞI ĐỘNG
====================================================
*/

render();


/*
Check ngay khi mở website
*/

checkAllAccounts();


/*
====================================================
AUTO CHECK 5 GIÂY

CHỈ CÓ 1 TIMER CHUNG
====================================================
*/

setInterval(
    checkAllAccounts,
    CHECK_INTERVAL
);

</script>

</body>
    </html>
